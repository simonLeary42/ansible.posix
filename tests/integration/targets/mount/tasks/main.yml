- name: Install dependencies (Linux)
  ansible.builtin.package:
    name: e2fsprogs
    state: present
  when: ansible_system == 'Linux'

- name: Install dependencies (FreeBSD)
  ansible.builtin.package:
    name: bash
    state: present

- name: swap
  import_tasks: swap.yml

- name: bind mount
  import_tasks: bind.yml

- name: remounted
  import_tasks: remounted.yml

- name: boot option for linux
  import_tasks: boot-option-linux.yml

- name: newline at EOF
  import_tasks: newline-eof.yml

- name: ephemeral
  import_tasks: ephemeral.yml

- name: opts_no_log
  import_tasks: opts_no_log.yml

- name: fixup
  import_tasks: fixup.yml
