- name: Install dependencies (Linux)
  ansible.builtin.package:
    name: e2fsprogs
    state: present
  when: ansible_system == 'Linux'

- name: Install dependencies (FreeBSD)
  ansible.builtin.package:
    name: bash
    state: present

- name: Create the mount point
  ansible.builtin.file:
    state: directory
    path: '{{ output_dir }}/mount_dest'
    mode: '0755'

- name: Create a directory to bind mount
  ansible.builtin.file:
    state: directory
    path: '{{ output_dir }}/mount_source'
    mode: '0755'

- name: Put something in the directory so we see that it worked
  ansible.builtin.copy:
    content: 'Testing

      '
    dest: '{{ output_dir }}/mount_source/test_file'
    mode: '0644'
  register: orig_info


- name: swap
  import_tasks: swap.yml

- name: bind mount
  import_tasks: bind.yml

- name: remounted
  import_tasks: remounted.yml

- name: boot option for linux
  import_tasks: boot-option-linux.yml

- name: newline at EOF
  import_tasks: newline-eof.yml

- name: ephemeral
  import_tasks: ephemeral.yml

- name: opts_no_log
  import_tasks: opts_no_log.yml

- name: fixup
  import_tasks: fixup.yml
