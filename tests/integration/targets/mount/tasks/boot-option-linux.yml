- name: Create empty file
  community.general.filesize:
    path: /tmp/myfs.img
    size: 20M

- name: Format FS
  community.general.filesystem:
    fstype: ext3
    dev: /tmp/myfs.img

- name: Mount the FS with noauto option
  ansible.posix.mount:
    path: /tmp/myfs
    src: /tmp/myfs.img
    fstype: ext3
    state: mounted
    boot: false
    opts: rw,user,async
  register: mount_info

- name: Assert the mount without noauto was successful
  ansible.builtin.assert:
    that:
      - mount_info['opts'] == 'rw,user,async,noauto'

- name: Unmount FS
  ansible.posix.mount:
    path: /tmp/myfs
    state: absent

- name: Mount the FS with noauto option and defaults
  ansible.posix.mount:
    path: /tmp/myfs
    src: /tmp/myfs.img
    fstype: ext3
    state: mounted
    boot: false
  register: mount_info

- name: Assert the mount without noauto was successful
  ansible.builtin.assert:
    that:
      - "'noauto' in mount_info['opts'].split(',')"

- name: Unmount FS
  ansible.posix.mount:
    path: /tmp/myfs
    state: absent

- name: Remove the test FS
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /tmp/myfs.img
    - /tmp/myfs
