- name: Block to test missing newline at the EOF of fstab
  when: ansible_system in ('Linux')
  block:
    - name: Create empty file
      community.general.filesize:
        path: /tmp/myfs1.img
        size: 20M
    - name: Format FS
      community.general.filesystem:
        fstype: ext3
        dev: /tmp/myfs1.img
    - name: Create custom fstab file without newline
      ansible.builtin.copy:
        content: '#TEST COMMENT WITHOUT NEWLINE'
        dest: /tmp/test_fstab
        mode: "0644"
    - name: Mount the FS using the custom fstab
      ansible.posix.mount:
        path: /tmp/myfs1
        src: /tmp/myfs1.img
        fstype: ext3
        state: mounted
        opts: defaults
        fstab: /tmp/test_fstab
    - name: Unmount the mount point in the custom fstab
      ansible.posix.mount:
        path: /tmp/myfs1
        state: absent
        fstab: /tmp/test_fstab
    - name: Remove the test FS and the custom fstab
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /tmp/myfs1.img
        - /tmp/myfs1
        - /tmp/test_fstab
